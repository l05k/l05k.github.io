name: 自动更新文章索引

# 每次 push 后重新扫描 posts/*.md，自动重写 posts.json 并提交。
# 这样从 Obsidian（Enveloppe 插件）发布文章后无需任何手动步骤。
on: push

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 重新生成 posts.json
        run: python3 scripts/update-index.py

      - name: 有变化则自动提交
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新文章索引 [skip ci]"
          file_pattern: posts.json
